name: Arbitre de qualitat

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    name: Àrbitre — proves automàtiques
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Auditoria estàtica
        run: python3 tests/auditor.py
      - name: Build Docker
        run: docker build --pull -t partits-test .
      - name: Validar Nginx
        run: docker run --rm partits-test nginx -t
      - name: Arrencar web
        run: docker run -d --name partits-web -p 8080:80 partits-test
      - name: Esperar Nginx
        run: |
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          docker logs partits-web
          exit 1
      - name: Comprovar pàgina
        run: curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:8080/ | grep -q 'PARTITS'
      - name: Comprovar proxy de dades
        run: curl --fail --retry 5 --retry-delay 2 --max-time 20 http://127.0.0.1:8080/api/esp.1/scoreboard | grep -q 'events'
      - name: Aturar contenidor
        if: always()
        run: docker rm -f partits-web || true
